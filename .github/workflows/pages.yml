name: Viewer

on:
  push:
    branches: [main]
    paths: [viewer/**, rank.py, fetch_atlas.py, fetch_neuronary.py, .github/workflows/pages.yml]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Fetch atlas and Neuronary recipes
        run: |
          uv run --no-project --with huggingface-hub fetch_atlas.py
          uv run --no-project fetch_neuronary.py
      - name: Pack viewer data
        run: |
          command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
          uv run --no-project --with numpy --with pyarrow viewer/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deploy
        uses: actions/deploy-pages@v4
